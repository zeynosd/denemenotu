<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Sana Çok Özel</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    height: 100vh;
    font-family: "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #ffdee9, #b5fffc);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  .box {
    background: rgba(255, 255, 255, 0.9);
    padding: 30px;
    border-radius: 16px;
    width: 320px;
    text-align: center;
    animation: fadeIn 1.2s ease;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    z-index: 2;
  }

  h3 {
    margin-bottom: 15px;
  }

  input {
    padding: 10px;
    width: 100%;
    border-radius: 8px;
    border: 1px solid #ccc;
  }

  button {
    margin-top: 15px;
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    background: #ff7aa2;
    color: white;
    font-size: 16px;
    cursor: pointer;
  }

  button:hover {
    background: #ff5c8a;
  }

  #note {
    display: none;
    margin-top: 20px;
    animation: fadeInNote 1s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
  }

  @keyframes fadeInNote {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Kalpler */
  .heart {
    position: absolute;
    top: -10px;
    font-size: 18px;
    animation: fall linear infinite;
    opacity: 0.8;
  }

  @keyframes fall {
    to {
      transform: translateY(110vh);
      opacity: 0;
    }
  }
</style>
</head>

<body>

<div class="box">
  <h3>Tanıştığımız günün tarihi ;)</h3>

  <input type="text" id="answer" placeholder="GG.AA.YYYY">

  <button onclick="check()">Aç</button>

  <div id="note">
   <img src="l-phase-15.webp" style="width:100%; border-radius:12px; margin-bottom:15px;">
    <p>
      Buraya Deniz için yazdığın not gelecek 🤍  
      Uzun, içten, sadece size ait.
    </p>
  </div>
</div>

<script>
  const correctAnswer = "03052023"; // BURAYI DEĞİŞTİR

  function check() {
    const userAnswer = document.getElementById("answer").value;
    if (userAnswer === correctAnswer) {
      document.getElementById("note").style.display = "block";
    } else {
      alert("Bir daha düşün 💭");
    }
  }

  // Kalp animasyonu
  const hearts = ["💗","💖","💘","💞"];

  setInterval(() => {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerText = hearts[Math.floor(Math.random() * hearts.length)];
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (3 + Math.random() * 3) + "s";
    document.body.appendChild(heart);

    setTimeout(() => {
      heart.remove();
    }, 6000);
  }, 500);
</script>

</body>
</html>
